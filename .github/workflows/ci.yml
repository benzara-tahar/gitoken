name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Xcode 26 ships on the macos-26 image. If that image is unavailable, use
    # `runs-on: macos-15`: its image also carries Xcode_26*.app bundles, which
    # scripts/select-xcode.sh picks up the same way (equivalent to
    # `sudo xcode-select -s /Applications/Xcode_26*.app`, without the sudo).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        id: xcode
        run: scripts/select-xcode.sh 26

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/GitokenCore/.build
            build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('**/Package.resolved', 'Packages/GitokenCore/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Test GitokenCore
        working-directory: Packages/GitokenCore
        run: swift test

      - name: Build app (Release)
        run: >
          xcodebuild
          -project Gitoken.xcodeproj
          -scheme Gitoken
          -configuration Release
          -derivedDataPath build/DerivedData
          build
