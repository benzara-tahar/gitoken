<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Gitoken</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262c3b"/>
      <stop offset=".55" stop-color="#11131a"/>
      <stop offset="1" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="700" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d9bff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3d9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset=".5" stop-color="#3d9bff"/>
      <stop offset="1" stop-color="#5b5cff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e3f2"/>
    </linearGradient>
    <filter id="blur" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation=".75"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- The app's 16-unit glyph: screen edge, notch, and the notification dropping out of it. -->
  <g transform="translate(512 512) scale(38) translate(-8 -8.4)">
    <path d="M2.5 2.75H13.5M5 2.75V5.75A3 3 0 0 0 11 5.75V2.75" fill="none" stroke="url(#ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="8" cy="12.75" r="1.55" fill="#3d9bff" filter="url(#blur)" opacity=".9"/>
    <circle cx="8" cy="12.75" r="1.55" fill="url(#dot)"/>
  </g>
</svg>
